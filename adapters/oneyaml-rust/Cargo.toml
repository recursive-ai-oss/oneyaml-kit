[package]
name = "oneyaml-kit-adapter"
description = "Kit adapter for oneyaml-rust (conformance protocol over stdin and stdout)."
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "oneyaml-kit-adapter"
path = "src/main.rs"

[dependencies]
# The library under test, pinned to an exact revision of its repository (the patch API the
# adapter uses is newer than the last release). Moving the pin is a deliberate change that is
# checked together with the deviation list.
oneyaml = { git = "https://github.com/recursive-ai-oss/oneyaml-rust", rev = "3ea4ac94d92a4c66382a7601c15ce1e987020533", default-features = false } # engine revision
oneyaml-syntax = { git = "https://github.com/recursive-ai-oss/oneyaml-rust", rev = "3ea4ac94d92a4c66382a7601c15ce1e987020533" } # engine revision
oneyaml-core = { git = "https://github.com/recursive-ai-oss/oneyaml-rust", rev = "3ea4ac94d92a4c66382a7601c15ce1e987020533" } # engine revision
serde_json = "=1.0.149"
base64 = "=0.22.1"

[profile.release]
opt-level = 2
debug = false
